[metadata]
name = simplifiapi
version = 0.0.1

[options]
install_requires =
    configargparse
    requests
python_requires = >=3.9
packages = find:

[options.extras_require]
dev =
    pytest>=7
    pytest-cov>=4
    responses>=0.23
    ruff>=0.1

[options.entry_points]
console_scripts =
    simplifiapi = simplifiapi.cli:main

[options.packages.find]
exclude =
    tests
name: Deploy Docs & Site

on:
  push:
    branches: [main]
    paths:
      - "simplifiapi/**"
      - "docs/**"
      - "site/**"
      - "setup.cfg"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -e ".[docs]"

      - name: Build Sphinx documentation
        run: sphinx-build -b html docs/ docs/_build/ -W

      - name: Combine docs and brochure site
        run: |
          mkdir -p _deploy/docs _deploy/brochure
          cp -r docs/_build/* _deploy/docs/
          cp -r site/* _deploy/brochure/

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _deploy
